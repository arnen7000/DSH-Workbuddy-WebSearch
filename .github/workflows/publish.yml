name: publish

# 在 GitHub 上「发布 Release」即自动发布到 npm。
#
# 用 OIDC 可信发布（Trusted Publishing）：不依赖任何长期有效的 npm token，
# 发布物自动附带 provenance 签名 —— 任何人都能验证「这个包确实由本仓库的这个
# 工作流、从这个提交构建」。前提是在 npmjs.com 的包设置里把本仓库登记为
# Trusted Publisher（见 GITHUB-SETUP.md）。
on:
  release:
    types: [published]
  workflow_dispatch:

# 最小权限：仓库内容只读 + 允许签发 OIDC 身份令牌。
# `id-token: write` 是可信发布的硬要求，缺了会以 ENEEDAUTH 失败。
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url 必须指向官方 registry（可信发布只支持 registry.npmjs.org）。
      # 刻意不开缓存：发布构建要的是可复现，不是快。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 可信发布要求 npm CLI >= 11.5.1；显式升级，免得踩到 Node 自带的旧版。
      - name: 升级 npm（可信发布要求 >= 11.5.1）
        run: npm install -g npm@latest && npm --version

      # 版本一致性闸门：Release tag 必须等于 package.json 的 version，
      # 否则会出现「tag 写 0.4.0、实际发出去 0.3.9」这类不可逆的错误。
      - name: 版本一致性闸门
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          PKG="$(node -p "require('./package.json').version")"
          TAG="${RELEASE_TAG#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json 的版本是 $PKG，Release tag 是 $TAG，两者不一致，拒绝发布。"
            exit 1
          fi
          echo "版本一致：$PKG"

      # 发布前跑三套检查，任一失败即不发布。
      - name: 发布前跑三套检查
        run: |
          node tools/regression.mjs "$PWD"
          node tools/scenarios.mjs "$PWD"
          node tools/check-github-meta.mjs "$PWD"

      # 可信发布不使用任何 token。这里显式确认环境里没有「真实」凭据，
      # 免得日后有人加回 NODE_AUTH_TOKEN，变成「看起来在用 OIDC、其实在用长期 token」。
      #
      # ⚠️ 必须放过 actions/setup-node 的占位值：一旦给了 registry-url，它会主动把
      # NODE_AUTH_TOKEN 设成字面量 XXXXX-XXXXX-XXXXX-XXXXX（它自己的注释是
      # "Set the token to a dummy value to avoid errors"），目的是让缺 token 的
      # `npm install` 不报错。那是无害的占位值，不是凭据 —— 早期版本没放过它，
      # 导致每次发布都在这一步误报失败。护栏 G5.11 钉住这条。
      #
      # 顺带确认 OIDC 身份令牌通道真的可用：`id-token: write` 若没生效，
      # 与其让 `npm publish` 报难懂的 ENEEDAUTH，不如在这里直接说清楚。
      - name: 确认未注入长期 token 且 OIDC 通道可用
        run: |
          set -eu
          PLACEHOLDER='XXXXX-XXXXX-XXXXX-XXXXX'
          if [ -n "${NODE_AUTH_TOKEN:-}" ] && [ "${NODE_AUTH_TOKEN}" != "$PLACEHOLDER" ]; then
            echo "::error::检测到真实的 NODE_AUTH_TOKEN —— 可信发布应走 OIDC，不应注入长期 token。"
            exit 1
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN 不应存在（可信发布用 OIDC）。"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::缺少 ACTIONS_ID_TOKEN_REQUEST_URL —— id-token: write 未生效，无法走 OIDC。"
            exit 1
          fi
          echo "未发现长期 token（setup-node 的占位值已忽略），OIDC 通道可用，将以 OIDC 身份发布。"

      - name: 发布到 npm（OIDC，自动生成 provenance）
        run: npm publish
